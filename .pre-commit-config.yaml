# Pre-commit configuration for dbt data transformation project
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

default_language_version:
  python: python3.12

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.sql$' # SQL files may need trailing whitespace
      - id: end-of-file-fixer
        exclude: '\.sql$'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: '^(README\.md|\.env\.example)$'

  # Python code formatting and linting with Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format


  # SQL linting with SQLFluff
  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.0.7
    hooks:
      - id: sqlfluff-lint
        additional_dependencies:
          [
            "sqlfluff-templater-dbt",
            "dbt-core==1.10.11",
            "dbt-snowflake==1.10.2",
          ]
        files: '^models/.*\.sql$'
        exclude: "^(dbt_packages/|target/|logs/|transform/)"
      - id: sqlfluff-fix
        additional_dependencies:
          [
            "sqlfluff-templater-dbt",
            "dbt-core==1.10.11",
            "dbt-snowflake==1.10.2",
          ]
        files: '^models/.*\.sql$'
        exclude: "^(dbt_packages/|target/|logs/|transform/)"


  # Security checks
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: '^(dbt_packages/|transform/|target/|logs/|node_modules/|\.env\.example|\.secrets\.baseline|README\.md)'


  # Local testing hooks
  - repo: local
    hooks:
      # dbt parsing/compilation check
      - id: dbt-parse
        name: dbt parse
        entry: make compile ENV=dev
        language: system
        types: [sql]
        pass_filenames: false
        always_run: true
        verbose: true

      # Project validation (consolidated env and structure validation)
      - id: project-validation
        name: project validation
        entry: make validate
        language: system
        files: "^(scripts/|\\.env\\.example|pyproject\\.toml|requirements\\.txt|dbt_project\\.yml|profiles/profiles\\.yml|Makefile|\\.github/).*"
        pass_filenames: false
        always_run: true

# Enhanced configuration for CI integration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  # Skip hooks that require AWS credentials or are too slow for pre-commit.ci
  skip: [dbt-parse]
  submodules: false

# Environment-specific configuration
default_install_hook_types: [pre-commit, pre-push, commit-msg]
default_stages: [pre-commit, pre-push]
minimum_pre_commit_version: "3.0.0"

# Fail fast - stop on first failure for faster feedback
fail_fast: true # Optimized for faster CI/CD performance
