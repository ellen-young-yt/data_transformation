version: 2

models:
  - name: stg_youtube_analytics__audience_retention
    description: Staging model for YouTube audience retention metrics by video and date
    columns:
      - name: audience_retention_id
        description: Surrogate key for audience retention records
        data_type: varchar
        tests:
          - not_null
      - name: video_id
        description: YouTube video identifier
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_youtube_analytics__video')
                field: video_id
      - name: calendar_date
        description: Date (in Pacific time) of the retention metrics
        data_type: date
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: date('2024-10-31')
                strictly: false
      - name: percent_of_video_elapsed
        description: Percentage of video elapsed at this measurement point
        data_type: number(18,2)
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0.01
                max_value: 1.00
                strictly: false
      - name: percent_watch_ratio
        description: Percentage of audience still watching at this point
        data_type: number(18,4)
        tests:
          - not_null
      - name: relative_retention_performance
        description: Relative retention performance metric
        data_type: number(18,4)
      - name: _fivetran_synced
        description: Timestamp when Fivetran last synced this record
        data_type: timestamp_ntz

  - name: stg_youtube_analytics__caption
    description: Staging model for YouTube video captions/subtitles
    columns:
      - name: caption_id
        description: Surrogate key for caption records
        data_type: varchar
        tests:
          - not_null
      - name: video_id
        description: YouTube video identifier
        data_type: varchar
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_youtube_analytics__video')
                field: video_id
      - name: languages
        description: Language code for the caption
        data_type: varchar
        tests:
          - not_null
      - name: caption_text
        description: Text content of the caption
        data_type: varchar
        tests:
          - not_null
      - name: start_time_seconds
        description: Start time of caption in seconds
        data_type: number(38,3)
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: duration_seconds
        description: Duration of caption display in seconds
        data_type: number(38,3)
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: _fivetran_synced
        description: Timestamp when Fivetran last synced this record
        data_type: timestamp_ntz
        tests:
          - not_null

  - name: stg_youtube_analytics__channel
    description: Staging model for YouTube channel information
    columns:
      - name: channel_id
        description: YouTube channel identifier
        data_type: varchar
        tests:
          - unique
          - not_null
      - name: title
        description: Channel title
        data_type: varchar
        tests:
          - not_null
      - name: custom_url
        description: Channel custom URL
        data_type: varchar
        tests:
          - not_null
      - name: description
        description: Channel description
        data_type: varchar
        tests:
          - not_null
      - name: number_of_views
        description: Total view count for the channel
        data_type: number
        tests:
          - not_null
      - name: number_of_subscribers
        description: Total subscriber count
        data_type: number
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: number_of_videos
        description: Total number of videos published
        data_type: number
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                strictly: false
      - name: thumbnails_json
        description: JSON object containing channel thumbnail URLs
        data_type: variant
        tests:
          - not_null
      - name: topic_ids
        description: Array of topic IDs associated with the channel
        data_type: variant
        tests:
          - not_null
      - name: _fivetran_synced
        description: Timestamp when Fivetran last synced this record
        data_type: timestamp_ntz
        tests:
          - not_null

  - name: stg_youtube_analytics__channel_basic
    description: Staging model for basic channel-level YouTube analytics metrics
    columns:
      - name: channel_basic_id
        description: Surrogate key for channel basic records
