                to: ref('stg_youtube_analytics__channel')
                field: channel_id
      - name: video_id
        description: YouTube video identifier (nullable for channel-level metrics)
        data_type: varchar
        tests:
          - relationships:
              arguments:
                to: ref('stg_youtube_analytics__video')
                field: video_id
              config:
                severity: warn
                warn_if: ">0"
      - name: calendar_date
        description: Date (in Pacific time) of the metric
        data_type: date
        tests:
